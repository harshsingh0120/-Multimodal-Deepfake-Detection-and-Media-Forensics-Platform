services:
  forensics:
    build: .
    image: deepfake-forensics-platform:1.0.0
    ports:
      - "8000:8000"
    environment:
      # The backend serves the built frontend, so same-origin — CORS not needed here.
      APP_NAME: "Multimodal Deepfake Forensics Platform"
      MAX_UPLOAD_MB: "100"
      CALIBRATION_TEMPERATURE: "1.3"
    restart: unless-stopped
    # Uploaded media is processed transiently; no volumes required.
